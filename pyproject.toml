# Tells pip which tool builds our package (setuptools is the standard one)
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Basic information about our project
[project]
name = "spam-shield"
version = "0.1.0"
description = "ML & NLP system classifying messages as ham, spam, phishing, or toxic"
requires-python = ">=3.12"

# Tells setuptools: "our package code lives inside the src folder"
[tool.setuptools.packages.find]
where = ["src"]

# Code style checker (run: ruff check .)
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused imports, undefined names),
# I: import order, B: likely bugs, UP: modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
