<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spam Shield Web</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
        }

        textarea {
            width: 100%;
            height: 120px;
            font-size: 16px;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 8px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }

        .safe {
            background: #e6f4ea;
        }

        .suspicious {
            background: #fff4e5;
        }

        .high {
            background: #fde8e8;
        }

        .error {
            background: #eeeeee;
        }
    </style>
</head>

<body>
    <h1>🛡️ Spam Shield</h1>
    <p>Paste a message and check it.</p>

    <textarea id="message" placeholder="Type or paste a message..."></textarea>
    <button id="check">Check message</button>

    <div id="result"></div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        const messageBox = document.getElementById("message");
        const checkButton = document.getElementById("check");
        const resultBox = document.getElementById("result");

        function showResult(text, style) {
            resultBox.textContent = text;
            resultBox.className = style;
            resultBox.style.display = "block";
        }

        async function checkMessage() {
            showResult("Checking...", "error");
            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: messageBox.value }),
                });
                const data = await response.json();

                if (!response.ok) {
                    showResult(`❌ ${data.detail}`, "error");
                    return;
                }
                const percent = Math.round(data.risk_score * 100);
                showResult(`${data.label.toUpperCase()}: risk ${percent}%. ${data.risk_message}`, data.risk_level);
            } catch (error) {
                showResult("❌ Can't reach the API. Is uvicorn running? (Look at the browser console.)", "error");
            }
        }

        checkButton.addEventListener("click", checkMessage);
    </script>
</body>

</html>
