# Continuous Integration: on every push and pull request, GitHub starts a fresh
# Linux machine, installs the project exactly from requirements.txt, checks the
# code style and runs every test. A red X on GitHub means something broke.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and the project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Check code style (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -v
